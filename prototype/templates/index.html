<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis-BPF Control Plane</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .log-container { height: calc(100vh - 200px); overflow-y: auto; }
        .log-entry { font-family: 'Fira Code', monospace; font-size: 0.875rem; border-bottom: 1px solid #1e293b; }
        .log-entry:last-child { border-bottom: none; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">Aegis-BPF</h1>
            <p class="text-xs text-slate-400 mt-1">Kernel-Level Enforcement</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="block px-4 py-2 rounded bg-slate-800 text-blue-400 font-medium">Live Monitor</a>
            <a href="#" class="block px-4 py-2 rounded text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition">Policies (YAML)</a>
            <a href="#" class="block px-4 py-2 rounded text-slate-400 hover:bg-slate-800 hover:text-slate-200 transition">Nodes (1 Active)</a>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <div class="flex items-center space-x-2">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="text-sm text-slate-300">Agent Sandbox: SECURE</span>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col bg-slate-950">
        <!-- Header -->
        <header class="h-16 border-b border-slate-800 flex items-center justify-between px-8 bg-slate-900/50">
            <h2 class="text-lg font-semibold">Live Threat Monitor</h2>
            <div class="flex space-x-4 text-sm">
                <div class="bg-slate-800 px-3 py-1 rounded border border-slate-700">Events: <span id="event-count" class="font-mono text-blue-400">0</span></div>
                <div class="bg-slate-800 px-3 py-1 rounded border border-red-900/50">Blocked: <span id="blocked-count" class="font-mono text-red-400">0</span></div>
            </div>
        </header>

        <!-- Log Viewer -->
        <div class="flex-1 p-6">
            <div class="bg-slate-900 rounded-lg border border-slate-800 h-full flex flex-col shadow-xl">
                <div class="px-4 py-3 border-b border-slate-800 bg-slate-800/50 flex text-xs font-semibold text-slate-400 uppercase tracking-wider">
                    <div class="w-24">Status</div>
                    <div class="w-24">PID</div>
                    <div class="w-32">Process</div>
                    <div class="w-32">Syscall</div>
                    <div class="flex-1">Target / Details</div>
                </div>
                <div id="logs" class="log-container p-2">
                    <!-- Logs will be injected here -->
                    <div class="p-3 text-slate-500 text-sm text-center italic" id="waiting-msg">Waiting for agent events...</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const logsContainer = document.getElementById('logs');
        const eventCountEl = document.getElementById('event-count');
        const blockedCountEl = document.getElementById('blocked-count');
        const waitingMsg = document.getElementById('waiting-msg');
        
        let eventCount = 0;
        let blockedCount = 0;

        const eventSource = new EventSource('/stream');
        
        eventSource.onmessage = function(e) {
            if (waitingMsg) waitingMsg.remove();
            
            const data = JSON.parse(e.data);
            eventCount++;
            eventCountEl.textContent = eventCount;

            const isBlocked = data.blocked === 1;
            if (isBlocked) {
                blockedCount++;
                blockedCountEl.textContent = blockedCount;
            }

            const statusColor = isBlocked ? 'text-red-400 font-bold' : 'text-emerald-400';
            const statusText = isBlocked ? 'BLOCKED' : 'ALLOWED';
            const rowBg = isBlocked ? 'bg-red-950/20 border-red-900/30' : 'border-slate-800/50';
            const details = isBlocked ? `<span class="text-red-300">${data.target}</span> <span class="text-slate-500 ml-2">— Policy violation: Terminated</span>` : `<span class="text-slate-300">${data.target}</span>`;

            const entry = document.createElement('div');
            entry.className = `log-entry flex items-center px-2 py-2 hover:bg-slate-800/50 transition ${rowBg}`;
            entry.innerHTML = `
                <div class="w-24 ${statusColor}">[${statusText}]</div>
                <div class="w-24 text-slate-400">${data.pid}</div>
                <div class="w-32 text-blue-300">${data.comm}</div>
                <div class="w-32 text-purple-400">${data.syscall}</div>
                <div class="flex-1 truncate">${details}</div>
            `;
            
            logsContainer.appendChild(entry);
            
            // Auto-scroll to bottom
            logsContainer.scrollTop = logsContainer.scrollHeight;
            
            // Keep only last 100 entries to prevent memory leak in browser
            if (logsContainer.children.length > 100) {
                logsContainer.removeChild(logsContainer.firstChild);
            }
        };
    </script>
</body>
</html>
